[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lixiang-mcp"
version = "0.1.0"
description = "Standalone, simulation-first Li Auto vehicle MCP service"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "licenses/ha-lixiang-MIT.txt"]
dependencies = ["mcp==1.26.0", "pydantic==2.12.5", "uvicorn==0.41.0", "starlette==1.7.0"]

[project.scripts]
lixiang-mcp = "lixiang_mcp.server:main"

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "httpx==0.28.1", "ruff==0.15.4", "mypy==1.19.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
